<!doctype html>
<html><head><meta charset="utf-8"><title>Dev Deepawali overlay v2</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Montserrat:wght@600;700;800;900&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
#stage{position:absolute;inset:0;overflow:hidden;color:#fff}
.abs{position:absolute}
/* safe area for Shorts: keep text left of the right-hand buttons and above the bottom bar */
.ctr{position:absolute;left:40px;width:900px;text-align:center}
.box{position:absolute;opacity:0}
:root{--gold:linear-gradient(180deg,#fff7da 0%,#f8d77e 36%,#dc9b2a 68%,#f6d47c 100%)}
.cz{font-family:Cinzel,serif;font-weight:900;letter-spacing:.06em;line-height:1;text-transform:uppercase}
.gold{text-shadow:none;background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.glow{filter:drop-shadow(0 0 20px rgba(255,185,80,.6)) drop-shadow(0 6px 10px rgba(0,0,0,.75))}
.white{color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9)}
.kick{font:700 27px Montserrat,sans-serif;letter-spacing:.38em;text-transform:uppercase;color:#f6d888;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.it{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:700;color:#fff8ea;text-shadow:0 2px 4px rgba(0,0,0,.95),0 0 26px rgba(0,0,0,.85)}
/* caption (lower-middle) */
.cap{position:absolute;left:60px;width:860px;top:1270px;text-align:center;opacity:0}
.cap span{display:inline;font:800 52px/1.3 Montserrat,sans-serif;color:#fff;text-shadow:0 0 3px #000,0 4px 0 rgba(0,0,0,.85),0 8px 22px rgba(0,0,0,.8)}
.cap .hl{color:#ffd451}
.cap .w{display:inline-block;opacity:0}
/* ornament */
.orn{display:flex;align-items:center;justify-content:center;gap:16px;height:26px}
.orn i{display:block;width:150px;height:2px;background:linear-gradient(90deg,rgba(243,207,116,0),#f3cf74)}
.orn i:last-child{background:linear-gradient(90deg,#f3cf74,rgba(243,207,116,0))}
.orn b{width:13px;height:13px;transform:rotate(45deg);background:#f6d27a;box-shadow:0 0 14px #ffcf6a}
/* lower-third label */
.lab{position:absolute;left:70px;padding-left:28px;opacity:0;max-width:850px}
.lab .bar{position:absolute;left:0;top:6px;bottom:6px;width:5px;border-radius:3px;background:linear-gradient(#ffe7a6,#d99a2b);box-shadow:0 0 16px rgba(255,200,100,.9);transform-origin:50% 0}
.lab .main{font:900 70px Cinzel,serif;letter-spacing:.04em;margin-top:6px;white-space:nowrap}
.lab .sub{font-size:44px;margin-top:2px}
/* list chip (chariot parts) */
.chip{position:absolute;left:70px;top:1250px;display:flex;align-items:center;gap:24px;opacity:0}
.chip .ic{width:118px;height:118px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:62px;background:radial-gradient(circle at 35% 30%,#3a2a12,#120c06);border:3px solid #f0c060;box-shadow:0 0 30px rgba(255,190,90,.7)}
.chip .t1{font:800 30px Montserrat;letter-spacing:.3em;color:#f6d888;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.chip .t2{font:900 66px Cinzel,serif;letter-spacing:.03em;margin-top:4px}
.chip .num{position:absolute;left:-14px;top:-14px;width:46px;height:46px;border-radius:50%;background:#f0c060;color:#2a1600;font:900 26px Montserrat;display:flex;align-items:center;justify-content:center}
/* deity card */
.card{position:absolute;left:60px;top:1240px;width:880px;display:flex;align-items:center;gap:30px;opacity:0}
.ring{width:170px;height:170px;flex:none;border-radius:50%;padding:6px;background:conic-gradient(from 200deg,#fff2c4,#d99a2b,#7a4a12,#f3cf74,#fff2c4);box-shadow:0 0 40px rgba(255,190,90,.65)}
.ring div{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:50% 28%;border:4px solid #120b06}
.card .nm{font:900 54px Cinzel,serif;letter-spacing:.06em}
.card .q{font-size:50px;line-height:1.15;margin-top:6px}
/* scrims */
.scB{position:absolute;left:0;top:1080px;width:1080px;height:840px;background:linear-gradient(180deg,rgba(5,4,10,0),rgba(5,4,10,.62) 40%,rgba(5,4,10,.78));opacity:0}
.scT{position:absolute;left:0;top:0;width:1080px;height:760px;background:linear-gradient(0deg,rgba(5,4,10,0),rgba(5,4,10,.62) 50%,rgba(5,4,10,.78));opacity:0}
.scC{position:absolute;left:0;top:560px;width:1080px;height:800px;background:radial-gradient(ellipse at 50% 50%,rgba(5,4,10,.75),rgba(5,4,10,0) 70%);opacity:0}
/* stamp + sign */
.stamp{display:inline-block;font:900 128px Cinzel,serif;letter-spacing:.05em;color:#ffdddd;padding:14px 40px 4px;border:8px solid #e8463a;border-radius:16px;text-shadow:0 0 30px rgba(255,60,40,.8);box-shadow:0 0 40px rgba(232,70,58,.7),inset 0 0 30px rgba(232,70,58,.5);background:rgba(30,6,6,.45)}
.sign{display:inline-block;padding:22px 44px 18px;border-radius:22px;background:linear-gradient(180deg,#1a3c8f,#0f2765);border:6px solid #fff;box-shadow:0 0 0 6px #0f2765,0 18px 40px rgba(0,0,0,.6)}
.sign .p{display:inline-flex;width:92px;height:92px;border-radius:16px;background:#fff;color:#0f2765;font:900 72px Montserrat;align-items:center;justify-content:center;margin-right:24px;vertical-align:middle}
.sign .t{display:inline-block;vertical-align:middle;text-align:left}
.sign .a{font:900 40px Montserrat;letter-spacing:.12em;color:#fff}
.sign .b{font:900 66px Montserrat;letter-spacing:.06em;color:#ffd451}
.date{display:inline-block;border-radius:26px;overflow:hidden;box-shadow:0 0 50px rgba(255,190,80,.6),0 20px 40px rgba(0,0,0,.6);text-align:center;width:330px}
.date .m{background:linear-gradient(90deg,#e05a2a,#f0a03a);font:900 40px Montserrat;letter-spacing:.2em;color:#fff;padding:12px 0}
.date .d{background:#fffaf0;font:900 170px Cinzel,serif;color:#2a1600;line-height:1.05;padding-top:10px}
.date .w{background:#fffaf0;font:800 34px Montserrat;letter-spacing:.3em;color:#a0601a;padding:0 0 18px}
/* fx */
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:1}85%{opacity:.9}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.dust{position:absolute;border-radius:50%;background:#ffe2a0;box-shadow:0 0 10px 3px rgba(255,200,110,.75);animation:rise 6s linear infinite}
.leak{position:absolute;border-radius:50%;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,205,130,.8),rgba(255,140,60,.35) 40%,rgba(255,120,40,0) 70%)}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 55% 35%,#fff,#fff4d6 45%,rgba(255,226,160,.85));opacity:0}
#dip{position:absolute;inset:0;background:#000;opacity:0}
.pulse{position:absolute;border-radius:50%;border:3px solid rgba(255,214,140,.85);opacity:0}
.alnL{position:absolute;left:536px;width:8px;border-radius:4px;background:linear-gradient(180deg,rgba(255,240,190,0),#fff1c0 15%,#ffd36a 50%,#fff1c0 85%,rgba(255,240,190,0));box-shadow:0 0 30px 10px rgba(255,200,90,.6);transform-origin:50% 0;opacity:0}
.node{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;border:4px solid #ffe7a6;box-shadow:0 0 30px rgba(255,210,120,.9),inset 0 0 20px rgba(255,210,120,.6);opacity:0}
.speed{position:absolute;inset:0;opacity:0;mix-blend-mode:screen}
.big{position:absolute;left:0;width:1080px;text-align:center;opacity:0}
</style></head>
<body><div id="stage"></div>
<script src="edit_tl.js"></script>
<script src="overlay2.js"></script>
</body></html>
